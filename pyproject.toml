[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admetus"
version = "0.1.0.dev0"
description = "ADMET property prediction from SMILES with LightGBM fold ensembles over Morgan and 2D pharmacophore fingerprints"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ytworks" }]
keywords = ["admet", "cheminformatics", "qsar", "rdkit", "lightgbm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
]

# The inference path deliberately stays small: `uvx admetus predict ...` should not
# pull pandas, optuna or scikit-learn. HTTP uses urllib from the standard library.
dependencies = [
  "rdkit>=2024.3.1",
  "lightgbm>=4.0,<5",
  "numpy>=2.0",
  "scipy>=1.11",
  "click>=8.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "pandas>=2.1",
  "optuna>=4.0",
  # LightGBMTunerCV lives here, not in optuna core. Automatic hyperparameter
  # tuning is a hard requirement, so this is not optional within the train extra.
  "optuna-integration>=4.0",
  "scikit-learn>=1.4",
  "tqdm>=4.65",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
admetus = "admetus.cli.main:main"

[project.urls]
Homepage = "https://github.com/ytworks/Admetus"
Source = "https://github.com/ytworks/Admetus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"admetus.data" = ["endpoints.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "network: reaches the network (excluded from CI)",
  "slow: long running",
  "needs_models: needs trained model bundles",
]
filterwarnings = ["error::DeprecationWarning:admetus.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
  "B905",  # zip() over sequences of equal length by construction
]

[tool.ruff.lint.per-file-ignores]
# The vendored fingerprint generator keeps upstream's structure on purpose.
"src/admetus/chem/pharm2d_fast.py" = ["C901", "SIM"]

[tool.coverage.run]
source = ["admetus"]
branch = true
