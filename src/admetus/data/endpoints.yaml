# The endpoint registry: one entry per public dataset Admetus trains a model on.
#
# 29 endpoints. The first 22 (in_official_group: true) are the datasets of the
# Therapeutics Data Commons ADMET benchmark group, so their numbers can be
# compared with the published leaderboard. The remaining 7 are additional public
# ADMET datasets from the same source.
#
# Fields
#   key                 Stable identifier. Also the output column name.
#   tdc_name            Dataset name as the upstream source publishes it.
#   dataverse_id        Harvard Dataverse file id. The dataset is fetched from
#                       https://dataverse.harvard.edu/api/access/datafile/<id>
#   label_name          For wide multi-task files, the label column to use.
#   task                classification | regression
#   metric              Primary metric. Chosen to match the official benchmark.
#   unit                Unit of the label, as published. Reported to callers.
#   transform           Label transform applied before training: log10 | log10_safe
#   output_range        Clamp predictions to this closed interval.
#   species_filter      Keep only rows whose Species column equals this.
#   standardize         Override the default standardization pipeline.
#   correlated_with     Other endpoints whose predictions are not independent.
#   expected_rows       Row count after normalization. Verified at fetch time.
#   notes               Why anything unusual above is the way it is.
#
# Defaults that are computed rather than stored: feature_set, trials, cv_repeats
# and low_confidence all follow from the training set size (see registry.py), so
# they are not duplicated per endpoint.

schema_version: 1

defaults:
  standardize: [cleanup, largest_fragment, uncharge]

endpoints:

  # ---------------------------------------------------------------- absorption
  - key: caco2
    tdc_name: Caco2_Wang
    dataverse_id: 4259569
    task: regression
    metric: mae
    unit: log cm/s
    in_official_group: true
    expected_rows: 906
    description: Caco-2 cell effective permeability.

  - key: pampa
    tdc_name: PAMPA_NCATS
    dataverse_id: 6695858
    task: classification
    metric: auroc
    unit: binary
    in_official_group: false
    expected_rows: 2034
    description: Parallel artificial membrane permeability, high vs low.

  - key: hia
    tdc_name: HIA_Hou
    dataverse_id: 4259591
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 578
    description: Human intestinal absorption.

  - key: pgp
    tdc_name: Pgp_Broccatelli
    dataverse_id: 4259597
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 1212
    description: P-glycoprotein inhibition.

  - key: bioavailability
    tdc_name: Bioavailability_Ma
    dataverse_id: 4259567
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 640
    description: Oral bioavailability.

  # ------------------------------------------------------------- distribution
  - key: lipophilicity
    tdc_name: Lipophilicity_AstraZeneca
    dataverse_id: 4259595
    task: regression
    metric: mae
    unit: logD (octanol/water, pH 7.4)
    in_official_group: true
    expected_rows: 4200
    description: Octanol/water distribution coefficient.

  - key: solubility
    tdc_name: Solubility_AqSolDB
    dataverse_id: 4259610
    task: regression
    metric: mae
    unit: log mol/L
    in_official_group: true
    expected_rows: 9982
    standardize: [cleanup, uncharge]
    notes: >-
      largest_fragment is omitted deliberately. Aqueous solubility is measured on
      the salt, so replacing a salt with its largest organic fragment would train
      on a label describing a different chemical species.
    description: Aqueous solubility.

  - key: bbb
    tdc_name: BBB_Martins
    dataverse_id: 4259566
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 1965
    description: Blood-brain barrier penetration.

  - key: ppbr
    tdc_name: PPBR_AZ
    dataverse_id: 6413140
    task: regression
    metric: mae
    unit: percent bound
    output_range: [0.0, 100.0]
    species_filter: Homo sapiens
    in_official_group: true
    expected_rows: 1614
    notes: >-
      The published file carries several species. Only human rows are used, which
      is also what the benchmark group does. Predictions are clamped to 0-100
      because the target is bounded and the metric is MAE.
    description: Plasma protein binding rate.

  - key: vdss
    tdc_name: VDss_Lombardo
    dataverse_id: 4267387
    task: regression
    metric: spearman
    unit: L/kg
    transform: log10_safe
    output_range: [0.0, null]
    in_official_group: true
    expected_rows: 1111
    notes: >-
      Spans roughly 0.01 to 700 L/kg. Trained in log10 space so the loss is not
      dominated by a handful of high-volume compounds. Spearman is rank-based, so
      the transform does not change the metric.
    description: Volume of distribution at steady state.

  # ---------------------------------------------------------------- metabolism
  - key: cyp2c9_veith
    tdc_name: CYP2C9_Veith
    dataverse_id: 4259577
    task: classification
    metric: auprc
    unit: binary
    in_official_group: true
    expected_rows: 12092
    correlated_with: [cyp2d6_veith, cyp3a4_veith, cyp1a2_veith, cyp2c19_veith]
    description: CYP2C9 inhibition.

  - key: cyp2d6_veith
    tdc_name: CYP2D6_Veith
    dataverse_id: 4259580
    task: classification
    metric: auprc
    unit: binary
    in_official_group: true
    expected_rows: 13130
    correlated_with: [cyp2c9_veith, cyp3a4_veith, cyp1a2_veith, cyp2c19_veith]
    description: CYP2D6 inhibition.

  - key: cyp3a4_veith
    tdc_name: CYP3A4_Veith
    dataverse_id: 4259582
    task: classification
    metric: auprc
    unit: binary
    in_official_group: true
    expected_rows: 12328
    correlated_with: [cyp2c9_veith, cyp2d6_veith, cyp1a2_veith, cyp2c19_veith]
    description: CYP3A4 inhibition.

  - key: cyp1a2_veith
    tdc_name: CYP1A2_Veith
    dataverse_id: 4259573
    task: classification
    metric: auprc
    unit: binary
    in_official_group: false
    expected_rows: 12579
    correlated_with: [cyp2c9_veith, cyp2d6_veith, cyp3a4_veith, cyp2c19_veith]
    description: CYP1A2 inhibition.

  - key: cyp2c19_veith
    tdc_name: CYP2C19_Veith
    dataverse_id: 4259576
    task: classification
    metric: auprc
    unit: binary
    in_official_group: false
    expected_rows: 12665
    correlated_with: [cyp2c9_veith, cyp2d6_veith, cyp3a4_veith, cyp1a2_veith]
    description: CYP2C19 inhibition.

  - key: cyp2c9_substrate
    tdc_name: CYP2C9_Substrate_CarbonMangels
    dataverse_id: 4259584
    task: classification
    metric: auprc
    unit: binary
    in_official_group: true
    expected_rows: 666
    description: CYP2C9 substrate.

  - key: cyp2d6_substrate
    tdc_name: CYP2D6_Substrate_CarbonMangels
    dataverse_id: 4259578
    task: classification
    metric: auprc
    unit: binary
    in_official_group: true
    expected_rows: 663
    description: CYP2D6 substrate.

  - key: cyp3a4_substrate
    tdc_name: CYP3A4_Substrate_CarbonMangels
    dataverse_id: 4259581
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 667
    description: CYP3A4 substrate.

  # ----------------------------------------------------------------- excretion
  - key: half_life
    tdc_name: Half_Life_Obach
    dataverse_id: 4266799
    task: regression
    metric: spearman
    unit: hours
    transform: log10_safe
    output_range: [0.0, null]
    in_official_group: true
    expected_rows: 665
    notes: >-
      Spans roughly 0.065 to 1200 hours. Trained in log10 space for the same
      reason as vdss.
    description: Terminal half-life.

  - key: clearance_hepatocyte
    tdc_name: Clearance_Hepatocyte_AZ
    dataverse_id: 4266187
    task: regression
    metric: spearman
    unit: uL/min/10^6 cells
    transform: log10_safe
    output_range: [0.0, null]
    in_official_group: true
    expected_rows: 1020
    notes: >-
      Contains values at or below the limit of quantification, so the transform
      floors at half the smallest positive value rather than taking log10(0).
    description: Hepatocyte intrinsic clearance.

  - key: clearance_microsome
    tdc_name: Clearance_Microsome_AZ
    dataverse_id: 4266186
    task: regression
    metric: spearman
    unit: mL/min/g
    transform: log10_safe
    output_range: [0.0, null]
    in_official_group: true
    expected_rows: 1102
    notes: Same limit-of-quantification handling as clearance_hepatocyte.
    description: Liver microsome intrinsic clearance.

  # ------------------------------------------------------------------ toxicity
  - key: ld50
    tdc_name: LD50_Zhu
    dataverse_id: 4267146
    task: regression
    metric: mae
    unit: -log10(mol/kg)
    in_official_group: true
    expected_rows: 7342
    notes: >-
      Already on a log scale, so no transform. Contains inorganics, metals and
      mixtures that RDKit cannot featurize; those rows are reported, not replaced.
    description: Acute oral toxicity in rats.

  - key: herg
    tdc_name: hERG
    dataverse_id: 4259588
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 645
    correlated_with: [herg_karim]
    notes: >-
      A different curation of the same assay as herg_karim, with substantial
      compound overlap. Kept because it is the benchmark-group dataset; for
      practical prediction prefer herg_karim, which is 20x larger.
    description: hERG channel blocking (benchmark curation).

  - key: herg_karim
    tdc_name: hERG_Karim
    dataverse_id: 6822246
    task: classification
    metric: auroc
    unit: binary
    in_official_group: false
    expected_rows: 13445
    correlated_with: [herg]
    description: hERG channel blocking (large multi-source curation).

  - key: ames
    tdc_name: AMES
    dataverse_id: 4259564
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 7255
    description: Ames mutagenicity.

  - key: dili
    tdc_name: DILI
    dataverse_id: 4259585
    task: classification
    metric: auroc
    unit: binary
    in_official_group: true
    expected_rows: 475
    description: Drug-induced liver injury.

  - key: carcinogens
    tdc_name: Carcinogens_Lagunin
    dataverse_id: 4259570
    task: classification
    metric: auprc
    unit: binary
    in_official_group: false
    expected_rows: 276
    description: Carcinogenicity.

  - key: skin_reaction
    tdc_name: Skin Reaction
    dataverse_id: 4259609
    task: classification
    metric: auroc
    unit: binary
    in_official_group: false
    expected_rows: 404
    description: Skin sensitization.

  - key: tox21_nr_ar
    tdc_name: Tox21
    dataverse_id: 4259612
    label_name: NR-AR
    task: classification
    metric: auprc
    unit: binary
    in_official_group: false
    expected_rows: 7265
    notes: >-
      One assay of the Tox21 panel: the androgen receptor, not general toxicity.
      The published file is wide, with one column per assay; the other 11 assays
      can be added as further entries without code changes.
    description: Tox21 NR-AR (androgen receptor) activity.
